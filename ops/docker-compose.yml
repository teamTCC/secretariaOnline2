version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# SecretariaOnline2 — Local & Containerised Stack
#
# Services: postgres, redis, minio, backend.
#
# Quick start:
#   cp backend/.env.example ops/.env && nano ops/.env   # fill JWT keys
#   docker compose -f ops/docker-compose.yml up --build
#
# For local Gradle development (no backend container):
#   docker compose -f ops/docker-compose.yml up postgres redis
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: secretaria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secretaria_dev
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretaria -d secretaria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - secretaria_net

  # ── Redis ────────────────────────────────────────────────────────────────────
  # Dual role:
  #   1. Session store: auth:session:<sid> → userId (fail-closed, TTL = accessTokenTTL+60s)
  #   2. Force-logout marker: auth:force-logout:user:<uuid>
  #   3. JTI blacklist legacy: auth:revoked:jti:<jti>
  #   4. BFF dashboard cache: bff-dashboard::<key> (TTL 60 s)
  #
  # Policy: noeviction — never silently drop auth keys under memory pressure.
  # Persistence: AOF everysec — auth session state survives restarts.
  redis:
    image: redis:7-alpine
    container_name: secretaria_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secretaria_net

  # ── MinIO (Object Storage — S3-compatible) ──────────────────────────────────
  # Stores request attachments via presigned URLs (no server bandwidth waste).
  # Console available at http://localhost:9001 (user: minioadmin / minioadmin).
  # For local Gradle dev (no backend container), expose both 9000 and 9001 via:
  #   docker compose -f ops/docker-compose.yml up postgres redis minio
  minio:
    image: minio/minio:latest
    container_name: secretaria_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # Official minio image has `mc`, not curl.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - secretaria_net

  # ── Backend (Spring Boot / Tomcat) ──────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: secretaria-online-2:latest
    container_name: secretaria_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Database — uses internal Docker network hostname
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secretaria_dev
      SPRING_DATASOURCE_USERNAME: secretaria
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}

      # Redis — internal hostname
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis

      # JWT RSA keys (required — must be set in ops/.env)
      SECURITY_JWT_PRIVATE_KEY: ${SECURITY_JWT_PRIVATE_KEY}
      SECURITY_JWT_PUBLIC_KEY: ${SECURITY_JWT_PUBLIC_KEY}
      SECURITY_JWT_ACCESS_TTL: ${SECURITY_JWT_ACCESS_TTL:-900}

      # Cookies — Secure=false inside Docker bridge (HTTP); set true when behind HTTPS proxy
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}

      # CORS — exact origins
      CORS_ALLOWED_ORIGIN_1: ${CORS_ALLOWED_ORIGIN_1:-http://localhost:3000}
      CORS_ALLOWED_ORIGIN_2: ${CORS_ALLOWED_ORIGIN_2:-http://localhost:5173}
      CORS_ALLOWED_ORIGIN_3: ${CORS_ALLOWED_ORIGIN_3:-}

      # CORS — wildcard patterns (Vercel previews: https://*.vercel.app)
      CORS_ALLOWED_ORIGIN_PATTERN_1: ${CORS_ALLOWED_ORIGIN_PATTERN_1:-}
      CORS_ALLOWED_ORIGIN_PATTERN_2: ${CORS_ALLOWED_ORIGIN_PATTERN_2:-}

      # Application base URL
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}

      # Email
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@ufpr.br}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # MinIO — uses internal Docker network hostname when running in compose;
      # override with MINIO_ENDPOINT=http://localhost:9000 for local Gradle dev.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        # service_started: MinIO image has no curl; a failing healthcheck must not block the stack.
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - secretaria_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  secretaria_net:
    driver: bridge
